[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-sentinel-agent"
version = "2.0.0"
description = "A local, evidence-backed repository audit agent powered by Codex"
requires-python = ">=3.10"
authors = [{name = "Gift"}]
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
apex = "apex_agent.cli:main"

[tool.setuptools.packages.find]
include = ["apex_agent*"]

[tool.setuptools.package-data]
apex_agent = ["methodology.md"]
